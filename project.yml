name: NovaStormIPTV
options:
  bundleIdPrefix: com.novastorm
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
    CODE_SIGN_STYLE: Automatic
targets:
  NovaStormIPTV:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: NovaStormIPTV
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.novastorm.iptv
        PRODUCT_NAME: NovaStormIPTV
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_STRICT_CONCURRENCY: minimal
    info:
      path: NovaStormIPTV/Info.plist
      properties:
        CFBundleDisplayName: NovaStorm IPTV
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - audio
        ITSAppUsesNonExemptEncryption: false
        # The gateway is plain HTTP on the LAN and over the WireGuard tunnel.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true

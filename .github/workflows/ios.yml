name: iOS
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # Sign-and-upload steps run only once the Apple secrets exist. Until then every push
  # still compiles the app for the simulator, so build errors surface immediately.
  HAS_SIGNING: ${{ secrets.ASC_KEY_ID }}

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (simulator, unsigned)
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild -project NovaStormIPTV.xcodeproj -scheme NovaStormIPTV -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO build \
            2>&1 | tee build/simulator.log | grep -E "error:|\*\* BUILD" || true
          grep -q "BUILD SUCCEEDED" build/simulator.log

      - name: Import distribution certificate
        if: env.HAS_SIGNING != ''
        env:
          P12_B64: ${{ secrets.DIST_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
        run: |
          echo "$P12_B64" | base64 --decode > dist.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security import dist.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          security find-identity -v -p codesigning build.keychain

      - name: App Store Connect API key
        if: env.HAS_SIGNING != ''
        env:
          P8: ${{ secrets.ASC_KEY_P8 }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          printf '%s\n' "$P8" > AuthKey.p8
          mkdir -p ~/private_keys && cp AuthKey.p8 ~/private_keys/AuthKey_${KEY_ID}.p8

      - name: Archive (signed)
        if: env.HAS_SIGNING != ''
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild -project NovaStormIPTV.xcodeproj -scheme NovaStormIPTV -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/NovaStormIPTV.xcarchive archive \
            DEVELOPMENT_TEAM="$TEAM_ID" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$PWD/AuthKey.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            2>&1 | tee build/archive.log | grep -E "error:|\*\* ARCHIVE" || true
          grep -q "ARCHIVE SUCCEEDED" build/archive.log

      - name: Upload to TestFlight
        if: env.HAS_SIGNING != ''
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/NovaStormIPTV.xcarchive \
            -exportOptionsPlist ExportOptions.plist -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$PWD/AuthKey.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

      - name: Build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build/*.log
          if-no-files-found: ignore
